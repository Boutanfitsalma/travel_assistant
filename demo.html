<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Travel Assistant — Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-0:#0A101E;
    --navy-1:#0F1728;
    --navy-2:#141F35;
    --amber:#F5A623;
    --amber-dim:#8A6014;
    --ink:#E8ECF3;
    --ink-dim:#7C8AA5;
    --line:#213049;
    --ok:#34D399;
    --err:#F0645F;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--navy-0);
    background-image:
      radial-gradient(circle at 20% -10%, rgba(245,166,35,0.06), transparent 45%),
      radial-gradient(circle at 100% 10%, rgba(52,211,153,0.04), transparent 40%);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }
  .board{
    width:100%;
    max-width:720px;
    background:var(--navy-1);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 30px 80px -30px rgba(0,0,0,0.6);
  }
  header{
    padding:22px 26px 18px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:
      repeating-linear-gradient(180deg, transparent, transparent 3px, rgba(255,255,255,0.012) 3px, rgba(255,255,255,0.012) 4px);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .mark{
    width:34px;height:34px;border-radius:8px;
    background:var(--amber);
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;font-weight:600;color:#241703;font-size:14px;
  }
  .brand h1{
    margin:0;font-family:'IBM Plex Mono',monospace;font-size:14px;
    letter-spacing:0.14em;text-transform:uppercase;font-weight:600;
  }
  .brand p{margin:2px 0 0;font-size:12px;color:var(--ink-dim);}
  .status{
    display:flex;align-items:center;gap:7px;
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.06em;
    color:var(--ok);text-transform:uppercase;
  }
  .status .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);}

  .board-strip{
    padding:10px 26px;
    border-bottom:1px solid var(--line);
    display:flex;gap:22px;overflow-x:auto;
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-dim);letter-spacing:0.08em;
  }
  .board-strip span b{color:var(--amber);font-weight:600;}

  main{
    height:440px;
    overflow-y:auto;
    padding:22px 26px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  main::-webkit-scrollbar{width:8px;}
  main::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}

  .row{display:flex;flex-direction:column;max-width:82%;}
  .row.user{align-self:flex-end;align-items:flex-end;}
  .row.assistant{align-self:flex-start;align-items:flex-start;}

  .bubble{
    padding:12px 15px;
    border-radius:12px;
    font-size:14.5px;
    line-height:1.55;
  }
  .row.user .bubble{
    background:var(--amber);
    color:#241703;
    border-bottom-right-radius:3px;
  }
  .row.assistant .bubble{
    background:var(--navy-2);
    border:1px solid var(--line);
    border-bottom-left-radius:3px;
  }

  .stub{
    margin-top:6px;
    display:flex;align-items:center;gap:6px;
    font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;
    color:var(--ink-dim);
    padding-left:2px;
  }
  .stub .tag{
    padding:2px 7px;border-radius:4px;
    border:1px dashed var(--amber-dim);
    color:var(--amber);
  }
  .stub .tag.tool{border-color:#2b5a8f;color:#6fb2f5;}
  .stub .tag.mixed{border-color:#3a6b52;color:var(--ok);}
  .stub .tag.error{border-color:#7a3a38;color:var(--err);}

  .thinking{display:flex;gap:4px;padding:14px 15px;}
  .thinking span{width:6px;height:6px;border-radius:50%;background:var(--ink-dim);animation:blink 1.2s infinite ease-in-out;}
  .thinking span:nth-child(2){animation-delay:0.2s;}
  .thinking span:nth-child(3){animation-delay:0.4s;}
  @keyframes blink{0%,80%,100%{opacity:0.25;}40%{opacity:1;}}

  footer{
    padding:16px 26px 22px;
    border-top:1px solid var(--line);
  }
  .composer{
    display:flex;gap:10px;
    background:var(--navy-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:6px 6px 6px 14px;
  }
  .composer input{
    flex:1;background:transparent;border:none;outline:none;
    color:var(--ink);font-family:'Inter',sans-serif;font-size:14.5px;
  }
  .composer input::placeholder{color:var(--ink-dim);}
  .composer button{
    background:var(--amber);color:#241703;border:none;
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12px;
    letter-spacing:0.06em;text-transform:uppercase;
    padding:0 18px;border-radius:7px;cursor:pointer;
  }
  .composer button:disabled{opacity:0.5;cursor:default;}
  .composer button:not(:disabled):hover{filter:brightness(1.08);}

  .hint{
    margin:10px 2px 0;font-size:11.5px;color:var(--ink-dim);
    display:flex;gap:14px;flex-wrap:wrap;
  }
  .hint button{
    background:none;border:none;color:var(--ink-dim);
    font-family:'Inter',sans-serif;font-size:11.5px;cursor:pointer;
    text-decoration:underline;text-decoration-color:var(--line);
    padding:0;
  }
  .hint button:hover{color:var(--amber);}
</style>
</head>
<body>

<div class="board">
  <header>
    <div class="brand">
      <div class="mark">TA</div>
      <div>
        <h1>Travel Assistant</h1>
        <p>RAG + Function calling · démo</p>
      </div>
    </div>
    <div class="status"><span class="dot"></span> API connectée</div>
  </header>

  <div class="board-strip">
    <span>ENDPOINT <b>POST /chat</b></span>
    <span>MODÈLE <b>OpenRouter / Function calling</b></span>
    <span>INDEX <b>7 documents · Chroma</b></span>
  </div>

  <main id="thread"></main>

  <footer>
    <div class="composer">
      <input id="input" type="text" placeholder="Posez une question sur un vol, une réservation, une politique..." autocomplete="off">
      <button id="send">Envoyer</button>
    </div>
    <div class="hint">
      <button onclick="ask('Quels sont les bagages autorisés en cabine ?')">Bagages cabine</button>
      <button onclick="ask('Quel est le statut du vol AH1235 aujourd\'hui ?')">Statut d'un vol</button>
      <button onclick="ask('Mon vol AH1235 est-il annulé ? Ai-je droit à un remboursement ?')">Cas combiné</button>
      <button onclick="resetConversation()">↺ Nouvelle conversation</button>
    </div>
  </footer>
</div>

<script>
  const API_URL = "http://127.0.0.1:8000/chat";
  const thread = document.getElementById('thread');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  let conversationId = null;

  function scrollDown(){ thread.scrollTop = thread.scrollHeight; }

  function addUserMessage(text){
    const row = document.createElement('div');
    row.className = 'row user';
    row.innerHTML = `<div class="bubble"></div>`;
    row.querySelector('.bubble').textContent = text;
    thread.appendChild(row);
    scrollDown();
  }

  function addThinking(){
    const row = document.createElement('div');
    row.className = 'row assistant';
    row.id = 'thinking-row';
    row.innerHTML = `<div class="bubble thinking"><span></span><span></span><span></span></div>`;
    thread.appendChild(row);
    scrollDown();
    return row;
  }

  function sourceTag(source){
    if(!source) return '';
    if(source === 'error') return '<span class="tag error">Erreur</span>';
    if(source.includes('+')){
      const parts = source.split('+').map(item => item.trim());
      const tools = parts.filter(item => item !== 'rag');
      const label = parts.includes('rag') ? ['RAG', ...tools].join(' + ') : parts.join(' + ');
      return `<span class="tag mixed">${label}</span>`;
    }
    if(source === 'rag') return '<span class="tag">Base documentaire</span>';
    if(source === 'llm') return '<span class="tag">Réponse directe</span>';
    return `<span class="tag tool">Outil · ${source}</span>`;
  }

  function renderAssistantText(container, text){
    const lines = text.split('\n');
    lines.forEach((line, lineIndex) => {
      const parts = line.split(/(\*\*[^*]+\*\*)/g);
      parts.forEach(part => {
        if(part.startsWith('**') && part.endsWith('**')){
          const strong = document.createElement('strong');
          strong.textContent = part.slice(2, -2);
          container.appendChild(strong);
        } else {
          container.appendChild(document.createTextNode(part));
        }
      });
      if(lineIndex < lines.length - 1) container.appendChild(document.createElement('br'));
    });
  }

  function addAssistantMessage(text, source){
    const row = document.createElement('div');
    row.className = 'row assistant';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    renderAssistantText(bubble, text);
    row.appendChild(bubble);
    const stub = document.createElement('div');
    stub.className = 'stub';
    stub.innerHTML = sourceTag(source);
    row.appendChild(stub);
    thread.appendChild(row);
    scrollDown();
  }

  async function ask(text){
    if(!text) text = input.value.trim();
    if(!text) return;
    input.value = '';
    sendBtn.disabled = true;
    addUserMessage(text);
    addThinking();

    try{
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message: text, conversation_id: conversationId})
      });
      document.getElementById('thinking-row').remove();
      if(!res.ok){
        addAssistantMessage("Erreur serveur (" + res.status + "). Vérifie que l'API tourne bien sur le port 8000.", 'error');
      } else {
        const data = await res.json();
        conversationId = data.conversation_id;
        addAssistantMessage(data.answer, data.source);
      }
    } catch(err){
      document.getElementById('thinking-row')?.remove();
      addAssistantMessage("Impossible de joindre l'API. Vérifie qu'elle tourne (uvicorn main:app --reload).", 'error');
    }
    sendBtn.disabled = false;
    input.focus();
  }

  function resetConversation(){
    conversationId = null;
    thread.innerHTML = '';
    addAssistantMessage("Nouvelle conversation. Posez-moi une question sur vos vols, réservations, ou nos politiques.", 'llm');
  }

  sendBtn.addEventListener('click', () => ask());
  input.addEventListener('keydown', e => { if(e.key === 'Enter') ask(); });

  addAssistantMessage("Bonjour, je suis votre assistant de voyage. Posez-moi une question sur vos vols, réservations, ou nos politiques.", 'llm');
</script>

</body>
</html>
